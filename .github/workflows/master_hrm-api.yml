# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - hrm-api

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: npm install and build
        working-directory: server
        run: |
          npm ci
          npm run build
          test -f dist/index.js
          npm prune --omit=dev

      # Explicit paths so dist/ is not dropped (server/.gitignore has "dist")
      - name: Prepare deploy package
        run: |
          mkdir -p deploy-pkg
          cp -r server/dist deploy-pkg/dist
          cp server/package.json server/package-lock.json deploy-pkg/
          if [ -d server/public ]; then cp -r server/public deploy-pkg/public; fi
          cp -r server/node_modules deploy-pkg/node_modules
          test -f deploy-pkg/dist/index.js
          ls -la deploy-pkg

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-pkg

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hrm-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6079EF58FC9245FDA2EA5ADC14CCE57F }}
